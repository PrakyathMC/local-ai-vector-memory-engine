name: Deploy Explorer

on:
  push:
    branches: [dev]
    paths:
      - "explorer/**"
      - ".github/workflows/deploy-explorer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages site
        shell: bash
        run: |
          mkdir -p _site/explorer
          cp explorer/index.html _site/explorer/index.html
          cp explorer/index.html _site/index.html
      - name: Upload Explorer artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
