[package]
name = "memory-python"
version = "0.1.0"
edition = "2024"
description = "Python bindings for the Local AI Vector Memory Engine"
license = "MIT"

[lib]
name = "local_ai_memory"
crate-type = ["cdylib"]

[dependencies]
memory-core = { path = "../memory-core" }
pyo3 = { version = "0.27", features = ["extension-module"] }
